<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="City of Melbourne datasets as map layers, with an AI guide that explains what is happening and where to go.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Melens">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Melens</title>
  <!-- Shown at once while the engine and the app download; removed on the
       first Flutter frame. -->
  <style>
    html, body { margin: 0; height: 100%; background: #fff; }
    @media (prefers-color-scheme: dark) { html, body { background: #0e1111; } }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 20px;
      font: 700 28px/1 Roboto, system-ui, sans-serif; letter-spacing: -0.5px;
      color: #00696b; transition: opacity .25s ease-out;
    }
    #splash.done { opacity: 0; pointer-events: none; }
    #splash i {
      width: 28px; height: 28px; border-radius: 50%;
      border: 3px solid rgba(0, 105, 107, .2); border-top-color: #00696b;
      animation: melens-spin .8s linear infinite;
    }
    @keyframes melens-spin { to { transform: rotate(360deg); } }
  </style>
  <link rel="manifest" href="manifest.json">
  <script>
    (() => {
      let pending;
      let configuration;
      window.melensLoadGoogleMapsApi = (apiKey, mapId) => {
        if (!apiKey || !apiKey.trim()) {
          return Promise.reject(new Error('GOOGLE_MAPS_WEB_API_KEY is required.'));
        }
        if (pending) {
          if (configuration.apiKey !== apiKey || configuration.mapId !== mapId) {
            return Promise.reject(new Error('Maps configuration cannot change within a page.'));
          }
          return pending;
        }
        configuration = { apiKey, mapId };
        pending = new Promise((resolve, reject) => {
          const script = document.createElement('script');
          let finished = false;
          const previousAuthFailure = window.gm_authFailure;
          const cleanup = () => {
            clearTimeout(timeout);
            delete window.melensGoogleMapsApiReady;
            window.gm_authFailure = previousAuthFailure;
          };
          const fail = (message) => {
            if (finished) return;
            finished = true;
            cleanup();
            script.remove();
            pending = undefined;
            configuration = undefined;
            reject(new Error(message));
          };
          const timeout = setTimeout(
            () => fail('Google Maps JavaScript API did not become ready within 15 seconds.'),
            15000,
          );
          window.melensGoogleMapsApiReady = () => {
            if (finished) return;
            finished = true;
            cleanup();
            resolve();
          };
          window.gm_authFailure = () => {
            fail('Google Maps authorization failed. Review the Web key restrictions and API setup.');
            if (previousAuthFailure) previousAuthFailure();
          };
          const parameters = new URLSearchParams({
            key: apiKey,
            loading: 'async',
            callback: 'melensGoogleMapsApiReady',
            v: 'weekly',
            libraries: 'marker',
            language: 'en',
            region: 'AU',
          });
          if (mapId) parameters.set('map_ids', mapId);
          script.src = `https://maps.googleapis.com/maps/api/js?${parameters}`;
          script.async = true;
          script.onerror = () => fail('Google Maps JavaScript API could not be reached.');
          const nonce = document.querySelector('script[nonce]')?.nonce;
          if (nonce) script.nonce = nonce;
          document.head.append(script);
        });
        return pending;
      };
    })();
    // Address search for user events (UC-09): the Places library of the Maps
    // JavaScript API, loaded on demand once the map's script is in. Results
    // cross to Dart as JSON strings. The project needs Places API (New)
    // enabled and allowed on the browser key; otherwise the promise rejects
    // and the form says search is unavailable.
    // The user's position, asked once and only when they switch on "My
    // location". Resolves to a JSON string; rejects with 'denied',
    // 'unavailable', 'timeout' or 'unsupported'. Nothing is stored.
    window.melensGetPosition = () => new Promise((resolve, reject) => {
      if (!navigator.geolocation) {
        reject(new Error('unsupported'));
        return;
      }
      navigator.geolocation.getCurrentPosition(
        (position) => resolve(JSON.stringify({
          lat: position.coords.latitude,
          lng: position.coords.longitude,
          accuracyM: position.coords.accuracy,
        })),
        (error) => reject(new Error(error.code === 1 ? 'denied' : error.code === 3 ? 'timeout' : 'unavailable')),
        { enableHighAccuracy: false, timeout: 15000, maximumAge: 60000 },
      );
    });
    (() => {
      // A session ties the suggestions and the chosen place into one billing unit.
      let session;
      const bounds = { west: 144, south: -39, east: 146.5, north: -37 };
      const placesLibrary = () => {
        if (!window.google?.maps?.importLibrary) {
          return Promise.reject(new Error('Google Maps is not loaded yet.'));
        }
        return google.maps.importLibrary('places');
      };
      window.melensSearchPlaces = async (query, lat, lng) => {
        const { AutocompleteSuggestion, AutocompleteSessionToken } = await placesLibrary();
        session ??= new AutocompleteSessionToken();
        const { suggestions } = await AutocompleteSuggestion.fetchAutocompleteSuggestions({
          input: query,
          sessionToken: session,
          includedRegionCodes: ['au'],
          language: 'en-AU',
          region: 'au',
          locationRestriction: bounds,
          origin: { lat, lng },
        });
        return JSON.stringify(suggestions
          .filter((suggestion) => suggestion.placePrediction)
          .map((suggestion) => ({
            placeId: suggestion.placePrediction.placeId,
            mainText: suggestion.placePrediction.mainText?.text ?? suggestion.placePrediction.text?.text ?? '',
            secondaryText: suggestion.placePrediction.secondaryText?.text ?? '',
          })));
      };
      window.melensResolvePlace = async (placeId) => {
        const { Place } = await placesLibrary();
        const place = new Place({ id: placeId });
        await place.fetchFields({ fields: ['location', 'displayName', 'formattedAddress'] });
        session = undefined;
        if (!place.location) throw new Error('The place has no location.');
        return JSON.stringify({
          lat: place.location.lat(),
          lng: place.location.lng(),
          name: place.displayName ?? '',
          address: place.formattedAddress ?? '',
        });
      };
    })();
  </script>
</head>
<body>
  <div id="splash" aria-label="Loading Melens" role="status">Melens<i></i></div>
  <script>
    window.addEventListener('flutter-first-frame', () => {
      const splash = document.getElementById('splash');
      if (!splash) return;
      splash.classList.add('done');
      setTimeout(() => splash.remove(), 300);
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
