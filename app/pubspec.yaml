name: melens
description: "Melens: City of Melbourne datasets as map layers, with Gemini agents in the chat panel."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  cupertino_icons: ^1.0.9
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  flutter:
    sdk: flutter
  # Required by the code gen-l10n generates; the app itself takes its
  # delegates from material_ui.
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_web_plugins:
    sdk: flutter
  freezed_annotation: ^3.1.0
  go_router: ^18.0.1
  google_maps_flutter: ^2.18.2
  http: ^1.6.0
  image_picker: ^1.2.3
  intl: ^0.20.3
  json_annotation: ^4.12.0
  logging: ^1.3.0
  # Material now ships outside the SDK. Import package:material_ui, never
  # package:flutter/material.dart.
  material_ui: ^1.4.0
  # Captures controls above the Maps Web platform view.
  pointer_interceptor: ^0.10.1+3
  riverpod_annotation: ^4.0.7
  timezone: ^0.11.1

dev_dependencies:
  build_runner: ^2.16.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^4.0.2
  json_serializable: ^6.14.1
  riverpod_generator: ^4.0.9
  riverpod_lint: ^3.1.9

flutter:
  generate: true
  uses-material-design: true
